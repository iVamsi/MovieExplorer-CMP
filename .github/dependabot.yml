version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      kotlin-ksp-compose:
        patterns:
          - "org.jetbrains.kotlin*"
          - "com.google.devtools.ksp*"
          - "androidx.compose*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
