name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - name: Configure catalog access
        run: |
          echo "TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}" >> local.properties
          echo "TMDB_BASE_URL=https://api.themoviedb.org/3/" >> local.properties
      - run: ./gradlew detekt testAndroidHostTest koverVerify
      - run: ./gradlew :androidApp:assembleDebug :androidApp:assembleRelease
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-reports
          path: '**/build/reports/**'

  ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - name: Configure catalog access
        run: echo "TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}" >> local.properties
      - run: ./gradlew iosSimulatorArm64Test
      - run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
